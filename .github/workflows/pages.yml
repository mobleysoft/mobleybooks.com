name: Deploy mobleybooks.com (public files only)

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'blog.html'
      - 'sitemap.xml'
      - 'robots.txt'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Stage only the real public files
        run: |
          mkdir -p _public_site
          # Explicit allowlist - anything not listed here (catalog/, tools/,
          # docs/, test/) never reaches the published output, regardless of
          # what else lives in this repo.
          cp index.html _public_site/
          [ -f blog.html ] && cp blog.html _public_site/ || true
          [ -f sitemap.xml ] && cp sitemap.xml _public_site/ || true
          [ -f robots.txt ] && cp robots.txt _public_site/ || true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _public_site
      - id: deployment
        uses: actions/deploy-pages@v4
